<script>
// ─── Minimal test framework ───────────────────────────────────────────────────

const suites = [];
let currentSuite = null;

function describe(name, fn) {
  currentSuite = { name, tests: [] };
  suites.push(currentSuite);
  fn();
  currentSuite = null;
}

function it(name, fn) {
  currentSuite.tests.push({ name, fn });
}

function expect(actual) {
  return {
    toBe(expected) {
      if (actual !== expected)
        throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    },
    toEqual(expected) {
      if (JSON.stringify(actual) !== JSON.stringify(expected))
        throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    },
    toBeTruthy() {
      if (!actual) throw new Error(`Expected truthy, got ${JSON.stringify(actual)}`);
    },
    toBeFalsy() {
      if (actual) throw new Error(`Expected falsy, got ${JSON.stringify(actual)}`);
    },
    toContain(item) {
      if (!actual.includes(item))
        throw new Error(`Expected ${JSON.stringify(actual)} to contain ${JSON.stringify(item)}`);
    },
    toMatch(re) {
      if (!re.test(actual))
        throw new Error(`Expected ${JSON.stringify(actual)} to match ${re}`);
    },
    toBeGreaterThanOrEqual(n) {
      if (actual < n) throw new Error(`Expected ${actual} >= ${n}`);
    },
    toBeLessThanOrEqual(n) {
      if (actual > n) throw new Error(`Expected ${actual} <= ${n}`);
    },
    toBeGreaterThan(n) {
      if (actual <= n) throw new Error(`Expected ${actual} > ${n}`);
    },
    not: {
      toBe(expected) {
        if (actual === expected)
          throw new Error(`Expected NOT ${JSON.stringify(expected)}`);
      },
      toContain(item) {
        if (actual.includes(item))
          throw new Error(`Expected ${JSON.stringify(actual)} NOT to contain ${JSON.stringify(item)}`);
      }
    }
  };
}

// ─── Re-implement game logic inline (pure functions extracted from game.js) ───

function determineSquareColor(squareName) {
  const columnChar = squareName.charAt(0).toUpperCase();
  const rowNum = parseInt(squareName.charAt(1));
  const columnNum = columnChar.charCodeAt(0) - 'A'.charCodeAt(0) + 1;
  return (columnNum + rowNum) % 2 === 0 ? "dark" : "light";
}

function generateRandomSquare() {
  const columns = ['A','B','C','D','E','F','G','H'];
  const rows = ['1','2','3','4','5','6','7','8'];
  return columns[Math.floor(Math.random() * 8)] + rows[Math.floor(Math.random() * 8)];
}

// ─── Game state simulation (mirrors game.js) ─────────────────────────────────

function createGameState() {
  return { correctAnswers: 0, totalQuestions: 0, isWaiting: false, currentSquare: "" };
}

function simulateAnswer(state, userGuess) {
  if (state.isWaiting) return state;
  const actualColor = determineSquareColor(state.currentSquare);
  const correct = userGuess === actualColor;
  return {
    ...state,
    totalQuestions: state.totalQuestions + 1,
    correctAnswers: state.correctAnswers + (correct ? 1 : 0),
    isWaiting: true,
    lastCorrect: correct,
    lastActualColor: actualColor
  };
}

// ─── Unit Tests ───────────────────────────────────────────────────────────────

describe("determineSquareColor — known squares", () => {
  it("A1 is dark", () => expect(determineSquareColor("A1")).toBe("dark"));
  it("A2 is light", () => expect(determineSquareColor("A2")).toBe("light"));
  it("B1 is light", () => expect(determineSquareColor("B1")).toBe("light"));
  it("B2 is dark", () => expect(determineSquareColor("B2")).toBe("dark"));
  it("H8 is dark", () => expect(determineSquareColor("H8")).toBe("dark"));
  it("H1 is light", () => expect(determineSquareColor("H1")).toBe("light"));
  it("A8 is light", () => expect(determineSquareColor("A8")).toBe("light"));
  it("D4 is dark", () => expect(determineSquareColor("D4")).toBe("dark"));
  it("E4 is light", () => expect(determineSquareColor("E4")).toBe("light"));
  it("G7 is dark", () => expect(determineSquareColor("G7")).toBe("dark"));
  it("C6 is light", () => expect(determineSquareColor("C6")).toBe("light"));
  it("F3 is light", () => expect(determineSquareColor("F3")).toBe("light"));
});

describe("determineSquareColor — case insensitivity", () => {
  it("lowercase a1 returns same as A1", () => {
    expect(determineSquareColor("a1")).toBe(determineSquareColor("A1"));
  });
  it("lowercase h8 returns same as H8", () => {
    expect(determineSquareColor("h8")).toBe(determineSquareColor("H8"));
  });
});

describe("determineSquareColor — alternation pattern", () => {
  it("adjacent squares in same row have opposite colors", () => {
    for (let col = 65; col < 72; col++) {
      const sq1 = String.fromCharCode(col) + "1";
      const sq2 = String.fromCharCode(col + 1) + "1";
      const c1 = determineSquareColor(sq1);
      const c2 = determineSquareColor(sq2);
      if (c1 === c2) throw new Error(`${sq1} and ${sq2} should differ but both are ${c1}`);
    }
  });

  it("adjacent squares in same column have opposite colors", () => {
    for (let row = 1; row < 8; row++) {
      const sq1 = "A" + row;
      const sq2 = "A" + (row + 1);
      const c1 = determineSquareColor(sq1);
      const c2 = determineSquareColor(sq2);
      if (c1 === c2) throw new Error(`${sq1} and ${sq2} should differ but both are ${c1}`);
    }
  });

  it("diagonal squares have same color", () => {
    const pairs = [["A1","B2"],["C3","D4"],["E5","F6"],["B4","C5"]];
    for (const [sq1, sq2] of pairs) {
      if (determineSquareColor(sq1) !== determineSquareColor(sq2))
        throw new Error(`Diagonal ${sq1} and ${sq2} should share color`);
    }
  });

  it("64 squares total: 32 dark, 32 light", () => {
    let dark = 0, light = 0;
    for (let col = 0; col < 8; col++) {
      for (let row = 1; row <= 8; row++) {
        const sq = String.fromCharCode(65 + col) + row;
        determineSquareColor(sq) === "dark" ? dark++ : light++;
      }
    }
    expect(dark).toBe(32);
    expect(light).toBe(32);
  });

  it("only returns 'dark' or 'light'", () => {
    for (let col = 0; col < 8; col++) {
      for (let row = 1; row <= 8; row++) {
        const sq = String.fromCharCode(65 + col) + row;
        const color = determineSquareColor(sq);
        if (color !== "dark" && color !== "light")
          throw new Error(`Unexpected color: ${color} for ${sq}`);
      }
    }
  });
});

describe("generateRandomSquare — output format", () => {
  it("returns a 2-character string", () => {
    for (let i = 0; i < 20; i++) expect(generateRandomSquare().length).toBe(2);
  });

  it("first character is A–H", () => {
    const valid = ['A','B','C','D','E','F','G','H'];
    for (let i = 0; i < 30; i++) {
      const sq = generateRandomSquare();
      if (!valid.includes(sq[0])) throw new Error(`Invalid column: ${sq[0]}`);
    }
  });

  it("second character is 1–8", () => {
    const valid = ['1','2','3','4','5','6','7','8'];
    for (let i = 0; i < 30; i++) {
      const sq = generateRandomSquare();
      if (!valid.includes(sq[1])) throw new Error(`Invalid row: ${sq[1]}`);
    }
  });

  it("produces output passable into determineSquareColor without error", () => {
    for (let i = 0; i < 20; i++) {
      const sq = generateRandomSquare();
      const color = determineSquareColor(sq);
      if (!["dark","light"].includes(color))
        throw new Error(`Bad output for generated square ${sq}: ${color}`);
    }
  });
});

describe("generateRandomSquare — distribution (100 samples)", () => {
  it("covers multiple columns", () => {
    const cols = new Set();
    for (let i = 0; i < 100; i++) cols.add(generateRandomSquare()[0]);
    expect(cols.size).toBeGreaterThan(4);
  });

  it("covers multiple rows", () => {
    const rows = new Set();
    for (let i = 0; i < 100; i++) rows.add(generateRandomSquare()[1]);
    expect(rows.size).toBeGreaterThan(4);
  });
});

describe("Game state — scoring logic", () => {
  it("starts at 0/0", () => {
    const s = createGameState();
    expect(s.correctAnswers).toBe(0);
    expect(s.totalQuestions).toBe(0);
  });

  it("correct answer increments both counters", () => {
    const s = { ...createGameState(), currentSquare: "A1" }; // A1 is dark
    const s2 = simulateAnswer(s, "dark");
    expect(s2.correctAnswers).toBe(1);
    expect(s2.totalQuestions).toBe(1);
    expect(s2.lastCorrect).toBe(true);
  });

  it("wrong answer increments only totalQuestions", () => {
    const s = { ...createGameState(), currentSquare: "A1" }; // A1 is dark
    const s2 = simulateAnswer(s, "light");
    expect(s2.correctAnswers).toBe(0);
    expect(s2.totalQuestions).toBe(1);
    expect(s2.lastCorrect).toBe(false);
  });

  it("sets isWaiting to true after answer", () => {
    const s = { ...createGameState(), currentSquare: "A2" };
    const s2 = simulateAnswer(s, "light");
    expect(s2.isWaiting).toBe(true);
  });

  it("ignores answer when isWaiting is true", () => {
    const s = { ...createGameState(), currentSquare: "A1", isWaiting: true };
    const s2 = simulateAnswer(s, "dark");
    expect(s2.totalQuestions).toBe(0);
  });

  it("score accumulates across multiple rounds", () => {
    const squares = ["A1","B1","A2","B2"]; // dark, light, light, dark
    const answers = ["dark","light","light","dark"];
    let s = createGameState();
    for (let i = 0; i < squares.length; i++) {
      s = { ...s, currentSquare: squares[i], isWaiting: false };
      s = simulateAnswer(s, answers[i]);
    }
    expect(s.correctAnswers).toBe(4);
    expect(s.totalQuestions).toBe(4);
  });

  it("reports correct actual color on wrong guess", () => {
    const s = { ...createGameState(), currentSquare: "H8" }; // H8 is dark
    const s2 = simulateAnswer(s, "light");
    expect(s2.lastActualColor).toBe("dark");
  });
});

describe("UI — integration: answer → feedback text", () => {
  it("correct answer produces feedback containing 'Correct'", () => {
    const square = "A1"; // dark
    const actualColor = determineSquareColor(square);
    const userGuess = actualColor;
    const msg = userGuess === actualColor
      ? `✓ Correct! ${square} is a ${actualColor} square. ✓`
      : `✗ Incorrect. ${square} is a ${actualColor} square. ✗`;
    expect(msg).toContain("Correct");
  });

  it("wrong answer produces feedback containing 'Incorrect'", () => {
    const square = "A1"; // dark
    const actualColor = determineSquareColor(square);
    const userGuess = "light";
    const msg = userGuess === actualColor
      ? `✓ Correct! ${square} is a ${actualColor} square. ✓`
      : `✗ Incorrect. ${square} is a ${actualColor} square. ✗`;
    expect(msg).toContain("Incorrect");
  });

  it("feedback always names the actual color", () => {
    const allSquares = [];
    for (let c = 0; c < 8; c++)
      for (let r = 1; r <= 8; r++)
        allSquares.push(String.fromCharCode(65+c)+r);

    for (const sq of allSquares) {
      const actual = determineSquareColor(sq);
      const msg = `${sq} is a ${actual} square`;
      if (!msg.includes(actual))
        throw new Error(`Feedback missing color for ${sq}`);

describe("UI — integration: score display matches state", () => {
  it("score label reflects game state after round", () => {
    let state = { ...createGameState(), currentSquare: "A1", isWaiting: false };
    state = simulateAnswer(state, "dark"); // correct
    const label = `Score: ${state.correctAnswers}/${state.totalQuestions}`;
    expect(label).toBe("Score: 1/1");
  });

  it("score never exceeds total questions", () => {
    let state = createGameState();
    const testData = [
      { sq: "A1", guess: "dark" },
      { sq: "B1", guess: "dark" }, // wrong (light)
      { sq: "A2", guess: "light" }, // correct
    ];
    for (const { sq, guess } of testData) {
      state = { ...state, currentSquare: sq, isWaiting: false };
      state = simulateAnswer(state, guess);
    }
    expect(state.correctAnswers).toBeLessThanOrEqual(state.totalQuestions);
  });
});

// ─── formatTime ───────────────────────────────────────────────────────────────

function formatTime(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = (seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

describe("formatTime — output format", () => {
  it("formats 0 seconds as 00:00", () => expect(formatTime(0)).toBe("00:00"));
  it("formats 60 seconds as 01:00", () => expect(formatTime(60)).toBe("01:00"));
  it("formats 90 seconds as 01:30", () => expect(formatTime(90)).toBe("01:30"));
  it("formats 59 seconds as 00:59", () => expect(formatTime(59)).toBe("00:59"));
  it("formats 3600 seconds as 60:00", () => expect(formatTime(3600)).toBe("60:00"));
  it("pads single-digit minutes", () => expect(formatTime(60)).toMatch(/^\d{2}:/));
  it("pads single-digit seconds", () => expect(formatTime(1)).toMatch(/:\d{2}$/));
});

// ─── Timer state ──────────────────────────────────────────────────────────────

function createTimerState(durationSeconds) {
  return { timerDuration: durationSeconds, timerRemaining: durationSeconds, expired: false };
}

function tickTimerState(state) {
  if (state.timerRemaining <= 0) return { ...state, expired: true };
  return { ...state, timerRemaining: state.timerRemaining - 1 };
}

describe("Timer state — tick logic", () => {
  it("remaining decrements by 1 per tick", () => {
    const s = tickTimerState(createTimerState(30));
    expect(s.timerRemaining).toBe(29);
  });

  it("does not decrement below 0", () => {
    const s = tickTimerState(createTimerState(0));
    expect(s.timerRemaining).toBe(0);
  });

  it("sets expired when remaining hits 0", () => {
    const s = tickTimerState(createTimerState(0));
    expect(s.expired).toBeTruthy();
  });

  it("not expired while time remains", () => {
    const s = tickTimerState(createTimerState(5));
    expect(s.expired).toBeFalsy();
  });

  it("expires exactly after duration ticks", () => {
    let s = createTimerState(3);
    for (let i = 0; i < 3; i++) s = tickTimerState(s);
    s = tickTimerState(s); // one more tick on 0
    expect(s.expired).toBeTruthy();
    expect(s.timerRemaining).toBe(0);
  });

  it("formatTime output matches remaining at mid-point", () => {
    let s = createTimerState(120);
    for (let i = 0; i < 60; i++) s = tickTimerState(s);
    expect(formatTime(s.timerRemaining)).toBe("01:00");
  });
});

});

    btn.classList.add("disabled");

    expect(btn.classList.contains("disabled")).toBeFalsy();
  });

  it("enabled state removes 'disabled' class from lightBtn", () => {
    const btn = document.getElementById("lightBtn");
    btn.classList.add("disabled");
    btn.classList.remove("disabled");
    expect(btn.classList.contains("disabled")).toBeFalsy();
  });
});

describe("newGame — state reset logic", () => {
  it("correctAnswers resets to 0", () => {
    let state = { correctAnswers: 7, totalQuestions: 10 };
    state = { ...state, correctAnswers: 0, totalQuestions: 0 };
    expect(state.correctAnswers).toBe(0);
  });

  it("totalQuestions resets to 0", () => {
    let state = { correctAnswers: 7, totalQuestions: 10 };
    state = { ...state, correctAnswers: 0, totalQuestions: 0 };
    expect(state.totalQuestions).toBe(0);
  });

  it("timerDuration resets to 0", () => {
    let state = { timerDuration: 120, timerRemaining: 45 };
    state = { ...state, timerDuration: 0, timerRemaining: 0 };
    expect(state.timerDuration).toBe(0);
  });

  it("timerRemaining resets to 0", () => {
    let state = { timerDuration: 120, timerRemaining: 45 };
    state = { ...state, timerDuration: 0, timerRemaining: 0 };
    expect(state.timerRemaining).toBe(0);
  });

  it("isWaiting resets to false after new question", () => {
    let isWaiting = true;
    isWaiting = false; // askNewQuestion sets this
    expect(isWaiting).toBe(false);
  });

  it("score label reads Score: 0/0 after reset", () => {
    const correct = 0, total = 0;
    const label = `Score: ${correct}/${total}`;
    expect(label).toBe("Score: 0/0");
  });

  it("new square is valid after reset", () => {
    const sq = generateRandomSquare();
    expect(sq.length).toBe(2);
    expect(['A','B','C','D','E','F','G','H']).toContain(sq[0]);
    expect(['1','2','3','4','5','6','7','8']).toContain(sq[1]);
  });
});

// ─── Runner ───────────────────────────────────────────────────────────────────

function runAll() {
  const resultsEl = document.getElementById("results");
  resultsEl.innerHTML = "";
  document.getElementById("summary").style.display = "flex";

  let totalPass = 0, totalFail = 0;

  for (const suite of suites) {
    const suiteEl = document.createElement("div");
    suiteEl.className = "suite";

    const header = document.createElement("div");
    header.className = "suite-header";
    header.textContent = suite.name;
    suiteEl.appendChild(header);

    for (const test of suite.tests) {
      let passed = false, error = null;
      try { test.fn(); passed = true; }
      catch (e) { error = e.message; }

      passed ? totalPass++ : totalFail++;

      const row = document.createElement("div");
      row.className = "test";
      row.innerHTML = `
        <span class="badge ${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'FAIL'}</span>
        <div class="test-body">
          <div class="test-name">${test.name}</div>
          ${error ? `<div class="test-error">${error}</div>` : ''}
        </div>
      `;
      suiteEl.appendChild(row);
    }

    resultsEl.appendChild(suiteEl);
  }

  document.getElementById("s-total").textContent = totalPass + totalFail;
  document.getElementById("s-pass").textContent = totalPass;
  document.getElementById("s-fail").textContent = totalFail;
}
</script>
