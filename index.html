<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Train your chessboard square color recognition - learn which squares are dark and light">
    <meta name="theme-color" content="#4CAF50">
    <title>Chess Squares - Color Trainer</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23F27C11'/><rect x='0' y='0' width='50' height='50' fill='%23BF4C0A'/><rect x='50' y='50' width='50' height='50' fill='%23BF4C0A'/></svg>">
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1>♞ CHESS SQUARES</h1>
            <p class="subtitle">Dark or Light?</p>
        </div>

        <div class="score-section">
            <div class="score-label" id="scoreLabel">Score: 0/0</div>
        </div>

        <div class="square-display">
            <div class="square-name" id="squareName">A1</div>
            <div class="question-text">Is this a dark or light square?</div>
        </div>

        <div class="button-container">
            <button class="chess-btn dark-btn" id="darkBtn">⬛ DARK</button>
            <button class="chess-btn light-btn" id="lightBtn">⬜ LIGHT</button>
        </div>

        <div class="message-area">
            <div class="feedback-message" id="feedbackMessage">Tap DARK or LIGHT to begin</div>
        </div>

            <div class="image-area" id="toggleArea">
                <div class="settingsColumn">
                    <button id="playerBtn" onclick="openPlayerPanel()">👤 GUEST</button>
                    <button id="newGameBtn" onclick="newGame()">NEW GAME</button>
                    <button id="settingsBtn" onclick="openSettingsPanel()">⚙️ SETTINGS</button>
                </div>
                <div>
                    <svg class="chessboard-svg" id="boardSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <rect width="200" height="200" fill="#FFFFFF"/>
                        <rect x="0" y="0" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="50" y="0" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="100" y="0" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="150" y="0" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="25" y="25" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="75" y="25" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="125" y="25" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="175" y="25" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="0" y="50" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="50" y="50" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="100" y="50" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="150" y="50" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="25" y="75" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="75" y="75" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="125" y="75" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="175" y="75" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="0" y="100" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="50" y="100" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="100" y="100" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="150" y="100" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="25" y="125" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="75" y="125" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="125" y="125" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="175" y="125" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="0" y="150" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="50" y="150" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="100" y="150" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="150" y="150" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="25" y="175" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="75" y="175" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="125" y="175" width="25" height="25" fill="#2F4F4F"/>
                        <rect x="175" y="175" width="25" height="25" fill="#2F4F4F"/>
                    </svg>
                    <img src="assets/stallion.png" id="knightImg" class="chessboard-svg" style="display: none;" alt="Knight">
                    <div class="image-caption" id="imageCaption">Beginner Mode</div>
                </div>
                
                <div id="playerOverlay" style="display:none">
                  <div id="playerPanel">
                    <h2>Players</h2>
                    <div id="playerList"></div>
                    <div id="addPlayerRow">
                      <input id="newPlayerInput" type="text" placeholder="New player name" maxlength="20">
                      <button onclick="addPlayer()">Add</button>
                    </div>
                    <button id="closePanel" onclick="closePlayerPanel()">✕</button>
                  </div>
                </div>

                <div id="settingsOverlay" style="display:none">
                  <div id="settingsPanel">
                    <h2>Settings</h2>

                    <div class="settings-section">
                      <h3>Timer</h3>
                      <div id="timerInputRow">
                        <input id="timerMinutes" type="number" min="1" max="60" placeholder="minutes">
                        <button onclick="startTimer()">Start</button>
                      </div>
                      <button id="noTimerBtn" onclick="clearTimer()">No Timer</button>
                    </div>

                    <div class="settings-section">
                      <h3>History</h3>
                      <div id="historyList"></div>
                      <button id="clearHistoryBtn" onclick="clearHistory()">Clear History</button>
                    </div>

                    <button id="closeSettingsPanel" onclick="closeSettingsOverlay()">✕</button>
                  </div>
                </div>
            </div>
        </div>
    </div>
    <audio id="clickSound" src="sounds/click.mp3"></audio>
    <audio id="levelSound" src="sounds/whoosh.mp3"></audio>
    <script src="scripts/game.js"></script>
</body>
</html>
